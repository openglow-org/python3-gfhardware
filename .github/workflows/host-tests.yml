name: Host tests

# The run-loop safety reactions, the feeder, the header refusal and the
# emulator run against fakes on every push. The suite imports the sibling
# gfutilities checkout the way the tree does, and each module runs in its
# own interpreter (the feeder binds the first fake cnc it sees).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: python3-gfhardware
      - uses: actions/checkout@v4
        with:
          repository: openglow-org/Glowforge-Utilities
          path: Glowforge-Utilities
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install the service library's dependencies
        run: python -m pip install --upgrade pip requests urllib3 websocket-client
      - name: Run every test module in its own interpreter
        working-directory: python3-gfhardware
        run: |
          set -e
          for t in tests/test_*.py; do
            m=$(basename "$t" .py)
            echo "== $m"
            python -m unittest -v "tests.$m"
          done
